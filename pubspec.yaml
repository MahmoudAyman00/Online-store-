name: onlineshoppingapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.1
  cloud_firestore: ^5.5.1
  firebase_auth: ^5.3.4
  cloud_functions: ^5.1.3
  fl_chart: ^0.69.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.1.0
  cached_network_image: ^3.2.3
  intl: ^0.20.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  lints: ^4.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  # Assets configuration
  assets:
    - assets/images/
    - assets/icons/
    - assets/data/products.json

  # Fonts configuration
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
    - family: NotoSansSymbols
      fonts:
        - asset: fonts/NotoSansSymbols-Regular.ttf
